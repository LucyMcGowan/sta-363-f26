project:
  type: website
  render:
    - "*.qmd"
    - "slides/*.qmd"
    - "ex/*.qmd"
    - "!*solution*"
    - "!*exam*"
    # Quarto's "*.qmd" matches recursively, not just the top level, so every
    # directory that holds .qmd files we do not publish has to be excluded by
    # name. slides-old is 53 R/knitr decks that fail on render.
    # ps holds Colab notebooks now. build_notebooks.py turns ps/*.qmd into
    # ps/*.ipynb, students open the notebook from GitHub, and the problem set
    # sources are not part of the website. ps/keys/*.qmd is the exception: the
    # answer keys render so a link can be sent to the grader, so the exclude
    # is scoped to the top-level ps/*.qmd rather than all of ps/**.
    - "!ps/*.qmd"
    - "!checkins/**"
    - "!slides-old/**"
    - "!slides-hastie/**"
    - "!_to_delete/**"
  resources:
    - "data/"
    - "img/"
    - "www/"

