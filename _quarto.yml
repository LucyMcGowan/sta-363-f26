format:
  html:
    theme:
      light: [united, custom.scss]
      dark: [united, custom.scss, dark.scss]
    css: www/fontawesome/css/all.min.css
    code-copy: true
    code-overflow: wrap
    linkcolor: "#d5008f"
    mainfont: "Fira Sans"
    toc: true

execute:
  freeze: auto
  warning: false
  message: false
